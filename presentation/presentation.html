        # The Problem

        ---

        # Building Production Agents Is Hard

        An API call gets you started. But production requires much more:

        --

        - **Orchestration** &#8212; chaining multiple LLM calls + tool executions

        --

        - **Multi-agent routing** &#8212; delegating tasks to specialized agents

        --

        - **Guardrails** &#8212; input/output validation, safety checks

        --

        - **Observability** &#8212; tracing, debugging, cost monitoring

        --

        - **User Interface** &#8212; a chat experience your users actually interact with

        --

        <div style="background: #FEF8E6; border: 2px solid #000000; border-radius: 0px; padding: 16px; margin-top: 16px;">
        <strong>OpenAI's answer:</strong> a layered stack &#8212; each layer builds on the previous one.
        </div>

        # Core Concepts &#8212; Workflows &amp; Nodes

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin: 24px 0;">
        <div style="background: #FBEAE7; padding: 20px; border: 2px solid #000000; border-radius: 0px;">
        <h3 style="margin-top: 0; color: #E86B5A;">Workflow</h3>
        <p style="font-size: 15px; color: #2A2825;"><strong>The blueprint.</strong> The complete graph of nodes that defines how a request is processed.</p>
        <ul style="font-size: 14px; color: #2A2825;">
        <li>Versioned and publishable</li>
        <li>Has a unique, stable ID</li>
        <li>The unit you build, test, and deploy</li>
        <li>Can be re-used across ChatKit, SDK, or API</li>
        </ul>
        </div>
        <div style="background: #E8F1F9; padding: 20px; border: 2px solid #000000; border-radius: 0px;">
        <h3 style="margin-top: 0; color: #5B9BD5;">Node</h3>
        <p style="font-size: 15px; color: #2A2825;"><strong>The building block.</strong> Each node does exactly one thing.</p>
        <ul style="font-size: 14px; color: #2A2825;">
        <li>Typed inputs and outputs</li>
        <li>Connections enforce data contracts</li>
        <li>Executes independently &#8212; traceable</li>
        <li>Chain nodes to compose complex behavior</li>
        </ul>
        </div>
        </div>

        --

        <div style="text-align: center; color: #5C5750; font-style: italic; margin-top: 8px;">
        A workflow is the graph. A node is the vertex. Edges carry typed data.
        </div>

        --

        - Each layer **builds on the previous** &#8212; no vendor lock-in at the SDK level
